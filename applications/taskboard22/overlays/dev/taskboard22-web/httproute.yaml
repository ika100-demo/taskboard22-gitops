apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: taskboard22-web
  labels:
    app: taskboard22-web
    app.kubernetes.io/name: taskboard22-web
    app.kubernetes.io/part-of: taskboard22
    app.kubernetes.io/managed-by: gitops-app
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: kube-system
  hostnames:
  - taskboard22-web.taskboard22-dev.localhost
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: taskboard22-web
      port: 80
